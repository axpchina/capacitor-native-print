ext {
    capacitorVersion = System.getenv('CAPACITOR_VERSION')
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "com.robusthomes.capacitor.nativeprint"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        testInstrumentationRunner "com.robusthomes.capacitor.nativeprint.PdfContractTest"
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        consumerProguardFiles 'proguard-rules.pro'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lintOptions {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Crypto classes are retained for source compatibility; encrypted input is
    // rejected by the private parser before any crypto provider is invoked.
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.72'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.72'
    implementation 'org.bouncycastle:bcutil-jdk15to18:1.72'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    if (System.getenv("CAP_PLUGIN_PUBLISH") == "true") {
        implementation "com.capacitorjs:core:$capacitorVersion"
    } else {
        implementation project(':capacitor-android')
    }

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    testImplementation "junit:junit:$junitVersion"
}

// Private, source-reviewed PDFBox port. The unsafe upstream AAR is never loaded.
// Hash fencing prevents an accidental unreviewed engine replacement.
def privatePdfArchive = file('vendor/pdfbox-private-2.0.27.0-r1.zip')
def privatePdfManifest = file('vendor/private-manifest.json')
def privatePdfDirectory = layout.buildDirectory.dir('generated/private-pdfbox')
def preparePrivatePdf = tasks.register('preparePrivatePdf', Sync) {
    inputs.file(privatePdfManifest)
    from(zipTree(privatePdfArchive))
    into(privatePdfDirectory)
    doFirst {
        def expected = new groovy.json.JsonSlurper().parse(privatePdfManifest).privateArchiveSha256
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(privatePdfArchive.bytes).encodeHex().toString()
        if (actual != expected) throw new GradleException('Private PDF engine integrity check failed')
    }
}
android.sourceSets.main.java.srcDir(privatePdfDirectory.map { it.dir('java') })
android.sourceSets.main.assets.srcDir(privatePdfDirectory.map { it.dir('assets') })
tasks.named('preBuild').configure { dependsOn(preparePrivatePdf) }
